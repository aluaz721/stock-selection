# Lint, unit tests, and a small backtest smoke test on every PR/push to main.
#
# The backtest smoke test uses 2 quarters, not the full 36-quarter history
# (~70+ min) -- it's here to catch "does ml_bucket_selection.py still run
# end-to-end through our wrapper" regressions, not to re-validate
# performance on every PR. Re-run the real backtest manually
# (backtests/compare_vs_benchmarks.py) when strategy logic actually changes.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/ -v

  backtest-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build local fundamentals DB
        run: python -m app.data.build_fundamentals_db

      - name: Backtest smoke test (2 quarters)
        run: |
          python -m backtests.run_backtest \
            --db data/finrl_trading.db \
            --infer-dates 2025-09-30 2025-12-31 \
            --top-n-per-bucket 3
